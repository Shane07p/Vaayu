services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaayu}
      POSTGRES_USER: ${POSTGRES_USER:-vaayu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaayu}
    ports:
      # Host port is configurable because a locally installed PostgreSQL also
      # binds 5432. When both listen, host connections reach whichever won the
      # bind and fail authentication against the wrong server. Set
      # POSTGRES_HOST_PORT=5433 in .env rather than stopping the local service.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaayu} -d ${POSTGRES_DB:-vaayu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vaayu}
      POSTGRES_USER: ${POSTGRES_USER:-vaayu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaayu}
      CONSOLE_SHARED_SECRET: ${CONSOLE_SHARED_SECRET:-dev-only-not-a-real-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Browser requests stay on the web origin and are proxied by the Next.js
      # route handler. This remains valid after deployment without baking a URL.
      NEXT_PUBLIC_API_URL: /api
      # Internal API URL used by Next.js RSC (server-side) to call the backend
      # container directly over the Docker network - avoids NAT round-trip.
      INTERNAL_API_URL: http://backend:8080
      # Passed to RSC calls that need the console auth header.
      CONSOLE_SECRET: ${CONSOLE_SHARED_SECRET:-dev-only-not-a-real-secret}
    ports:
      - "3000:3000"

  # Connector runner. Not started by `docker compose up` -- it belongs to the
  # `jobs` profile so bringing up the stack never writes to the database as a
  # side effect. Invoke one explicitly:
  #
  #   docker compose run --rm ingestion vaayu-openmeteo
  #   docker compose run --rm ingestion vaayu-firms
  #   docker compose run --rm ingestion vaayu-openaq --days 60
  #
  # DATABASE_URL points at the service name, not the published host port,
  # because a locally installed PostgreSQL may own 5432 on the host.
  ingestion:
    build: ./ingestion
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vaayu}:${POSTGRES_PASSWORD:-vaayu}@postgres:5432/${POSTGRES_DB:-vaayu}
      # Absent or blank puts that connector in fixture mode rather than
      # failing. See ingestion.source.Source.
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      GEE_SERVICE_ACCOUNT_KEY: ${GEE_SERVICE_ACCOUNT_KEY:-}
    volumes:
      # GEE_SERVICE_ACCOUNT_KEY is a path, not the key itself, so the file has to
      # exist inside the container. Without this the connectors saw no key and
      # ran in fixture mode however real the credential on the host was.
      # Read-only: nothing here should ever write to a credential.
      - ./secrets:/app/secrets:ro

  # Runs the scheduled jobs on a developer machine, from the same definitions
  # Cloud Scheduler is handed in infra/scheduler-jobs.json. Local and deployed
  # cadence cannot drift because there is one file, not two.
  #
  # Opt in, because it makes outbound API calls on a timer:
  #
  #   docker compose --profile scheduler up -d scheduler
  #
  # --run-now fills an empty stack immediately rather than waiting for the hour.
  scheduler:
    build: ./ingestion
    profiles: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["vaayu-scheduler", "--jobs-file", "/app/infra/scheduler-jobs.json", "--run-now"]
    volumes:
      - ./infra:/app/infra:ro
      - ./secrets:/app/secrets:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vaayu}:${POSTGRES_PASSWORD:-vaayu}@postgres:5432/${POSTGRES_DB:-vaayu}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      GEE_SERVICE_ACCOUNT_KEY: ${GEE_SERVICE_ACCOUNT_KEY:-}
      OPENAQ_REQUESTS_PER_MINUTE: ${OPENAQ_REQUESTS_PER_MINUTE:-60}

volumes:
  pgdata:
