spring:
  config:
    import: classpath:grap-rules.yaml

  application:
    name: vaayu-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaayu}
    username: ${POSTGRES_USER:vaayu}
    password: ${POSTGRES_PASSWORD:vaayu}

  jpa:
    hibernate:
      # validate, never create or update. Flyway owns the schema, because the
      # Python side depends on it too. Hibernate must never alter a table.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Required by this repo's numbering, not a relaxation of discipline.
    #
    # Late additions live in a V900+ block (V900 seed data, V901 tag seed cells,
    # V902 alert interval constraint). Once V900 is applied, every migration in
    # the main sequence is numerically lower than what the database already has,
    # so V13 arriving from another branch fails validation:
    #
    #   Detected resolved migration not applied to database: 13.
    #
    # That is not a mistake in V13. It is what the two-block scheme guarantees
    # for any branch that adds to the main sequence, and it will recur on every
    # such branch until the blocks are consolidated.
    #
    # baseline-on-migrate stays false: this permits applying a migration late,
    # which is a real thing that happened, and still refuses to invent a
    # baseline for a schema whose history is unknown.
    out-of-order: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

vaayu:
  web:
    allowed-origin: ${WEB_ALLOWED_ORIGIN:http://localhost:3000}
  console:
    # Stub auth only. Not an identity provider. Replace before any deployment.
    shared-secret: ${CONSOLE_SHARED_SECRET:dev-only-not-a-real-secret}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}

resilience4j:
  circuitbreaker:
    instances:
      gemini:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
